<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gatinhos Aleatórios 🐱</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f5f5f5;
    }

    h1 {
      margin-top: 20px;
    }

    img {
      max-width: 400px;
      margin-top: 20px;
      border-radius: 10px;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      background-color: #ff9800;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #e68900;
    }
  </style>
</head>
<body>

  <h1>🐱 Gatinhos Aleatórios</h1>
  <button onclick="buscarGato()">Nova imagem</button>
  <br>
  <img id="imagemGato" src="" alt="Gatinho">

  <script>
    async function buscarGato() {
      try {
        const resposta = await fetch("https://api.thecatapi.com/v1/images/search");
        const dados = await resposta.json();
        document.getElementById("imagemGato").src = dados[0].url;
      } catch (erro) {
        alert("Erro ao carregar imagem 😿");
      }
    }

    // Carrega uma imagem ao abrir a página
    buscarGato();
  </script>

</body>
</html>
